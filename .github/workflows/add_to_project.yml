name: Add to project board
 
on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]

# The job authenticates with PROJECT_BOARD_TOKEN, so GITHUB_TOKEN needs no permissions.
permissions: {}

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2
        with:
          project-url: https://github.com/orgs/laravel-chronicle/projects/3
          github-token: ${{ secrets.PROJECT_BOARD_TOKEN }}
 
